name: 'tapmad_engagement_dbt'
version: '1.0.0'
config-version: 2

profile: 'tapmad_databricks'

models:
  tapmad_engagement_dbt:
    staging:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
      +file_format: delta
      # Z-ordering optimization configuration for Databricks/Fabric
      +tblproperties:
        'delta.autoOptimize.optimizeWrite': 'true'
        'delta.autoOptimize.autoCompact': 'true'
